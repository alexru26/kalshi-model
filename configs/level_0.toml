# Level 0: two identical traders with private clues and the
# market maker under Kalshi rules. No news, no network. Unlisted settings keep their
# defaults (configs/default.toml).
# Run: uv run python experiments/plot_run.py --config configs/level_0.toml

n_agents = 2
n_steps = 500
turns_per_step = 2            # both agents act every step

n_clues_total = 10
n_private = 10
clue_accuracy = 0.6           # q: chance each clue points to the truth
n_news_seeds = 0
mean_degree = 0               # no network

# Traits every agent shares.
market_trust = 5.0            # how many clues the agent thinks the price is worth
w_depth = 0.0                 # ignore book imbalance
noise = 0.0                   # belief noise per turn (log-odds)
min_edge = 2.0                # smallest edge worth acting on (cents)
patience = 0.75               # chance of posting a resting order instead of waiting
kelly_frac = 0.5              # fraction of the Kelly bet placed
g = 0.8                       # probability weighting (1 = none)

[traits]                      # traits otherwise drawn per agent, pinned here
n_clues = 5                   # private clues held
cash = 100_000                # starting cash in cents
