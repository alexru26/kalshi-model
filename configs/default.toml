# The frozen defaults: every Config field (src/kalshi_model/config.py), one line each.
# Config reads this file at import, so editing a value here changes the default for every
# run, test, and experiment that does not set it. The model refuses to start if a setting
# is missing, unknown, or invalid. Experiments save each run's full configuration.
#
# Custom configurations (README, kalshi_model/custom.py) set only what differs from this
# file; copying it is a good starting point. Its market is set directly, through
# `mechanism` and the two fees:
#   Kalshi:         mechanism = "clob", taker_fee_bp = 700, maker_fee_bp = 0
#   CLOB, no fees:  mechanism = "clob", taker_fee_bp = 0,   maker_fee_bp = 0
#   AMM (LMSR):     mechanism = "amm",  taker_fee_bp = 0,   maker_fee_bp = 0   (legacy, not in E1)
# Money is in integer cents. Settings marked "calibrated" were tuned to Kalshi data;
# changing them leaves the calibrated region.
# Run: uv run python experiments/plot_run.py --config configs/default.toml

# --- Run size --------------------------------------------------------------------------
n_agents = 300
n_steps = 2000
turns_per_step = 20           # agents drawn each step, equal chances unless activity is pinned

# --- Market rules ----------------------------------------------------------------------
mechanism = "clob"            # "clob" (order book) or "amm" (LMSR, legacy)
lmsr_b = 50.0                 # LMSR liquidity in contracts (legacy AMM only)
taker_fee_bp = 700            # taker fee rate in basis points: 700 = 0.07 x C x P x (1 - P)
maker_fee_bp = 0              # the legacy AMM requires both fees to be 0

# --- Order book reading and upkeep -----------------------------------------------------
spread_cap = 10               # widest spread (c) at which agents read the midpoint, not the last trade
depth_window = 2              # cents from each best price counted in book imbalance
stale_ticks = 3               # an order this many cents behind the best quote is stale...
stale_steps = 20              # ...and is canceled to reprice after this many steps

# --- Market maker (order book only) ----------------------------------------------------
mm_cash = 1_000_000           # starting cash
mm_size = 36                  # contracts quoted on each side; 0 turns the market maker off (calibrated)
mm_half_spread = 2.72         # base half-spread in cents (calibrated)
mm_max_half_spread = 10.0
mm_alpha = 0.1                # weight of each trade price in its moving price estimate
mm_skew = 0.05                # cents the quotes move against each contract of inventory
mm_widen = 0.5                # extra half-spread per cent of markout loss per quoted contract
mm_decay = 0.9                # share of the extra half-spread kept each step
mm_max_inventory = 200        # inventory cap, contracts long or short

# --- World and clues -------------------------------------------------------------------
n_clues_total = 80            # M clues in all; 0 = no information (P* stays 50%)
n_private = 60                # the first K are private; the other M - K are released as news
clue_accuracy = 0.53          # q: chance each clue points to the truth (0.5 < q < 1)
n_news_seeds = 5              # agents who get each news (or fake) clue at release

# --- Information network ---------------------------------------------------------------
network = "holme_kim"         # holme_kim; watts_strogatz only for small demos (a ring)
mean_degree = 8               # even and < n_agents; 0 = no network
hk_triad = 0.5                # Holme-Kim chance of closing a triangle after each link
ws_rewire = 0.0               # Watts-Strogatz rewiring probability (demos only)
beta = 0.5                    # chance per step that a spreader tells each neighbor
disinfo_ratio = 0.0           # fake clues per true news clue

# --- Manipulator (order book only) -----------------------------------------------------
manipulator = "none"          # "none", "twin" (honest), "pump", or "spoof"
manip_n_clues = 2             # private clues it holds (<= n_private)
manip_cash_share = 0.05       # its cash as a share of all agents' cash
manip_start = 1000            # step its manipulation layer starts
manip_chunk = 2000            # most contracts the pump buys, or the dump sells, per turn
pump_push = 5                 # cents above the start price at which the pump stops buying
pump_max_steps = 100          # longest the pump buys, and the dump sells
pump_hold = 50                # steps held between pump and dump
spoof_size = 20_000           # contracts in each fake bid
spoof_ticks = 2               # cents behind the best bid for the fake bid (<= depth_window)
spoof_qty = 2000              # contracts the spoofer really offers at the best ask
spoof_steps = 500             # steps the spoofing lasts

# --- Agent traits ----------------------------------------------------------------------
# Only informedness and cash vary across agents; every other trait is one value for all.
n_clues_mean = 20.0           # informedness: negative binomial mean (not calibrated)
n_clues_dispersion = 0.2      # and dispersion; lower = more agents with none (not calibrated)
cash_median = 233_400         # starting cash: lognormal median (calibrated)
cash_sigma = 1.30             # and log-scale spread (calibrated)
cash_rho = 0.625              # rank correlation of cash with informedness (calibrated)
w_hearsay = 0.4               # weight on fakes heard from neighbors, 0 to 1 (not calibrated)
market_trust = 35             # how many clues an agent thinks the price is worth (calibrated)
w_depth = 0.1                 # log-odds nudge from book imbalance, 0 to 1 (not calibrated)
noise = 0.05                  # belief noise per turn, in log-odds (calibrated)
min_edge = 2                  # smallest edge worth acting on, in cents (calibrated)
patience = 0.90               # chance of posting a resting order instead of waiting (calibrated)
kelly_frac = 0.275            # fraction of the Kelly bet placed (calibrated)
g = 0.8                       # probability weighting, 1 = none (from lab estimates)

# --- Pinned traits (custom configurations only, not defaults) ------------------------
# A custom configuration can pin traits in a [traits] table: one value for every agent,
# or a list with one value per agent (e.g. n_clues = [20, 0] for two agents). A pinned
# n_clues still feeds the cash link unless cash is pinned too. Activity (equal for
# everyone unless pinned) has no setting above.
# [traits]
# n_clues = 0                 # private clues held (integer >= 0, capped at n_private)
# w_hearsay = 0.5             # weight on fakes heard from neighbors, 0 to 1
# market_trust = 50.0         # how many clues the agent thinks the price is worth, >= 0
# w_depth = 0.1               # log-odds nudge from book imbalance, 0 to 1
# noise = 0.05                # belief noise per turn (log-odds), >= 0
# min_edge = 2.0              # smallest edge worth acting on (cents), >= 0
# patience = 0.7              # chance of posting a resting order instead of waiting, 0 to 1
# kelly_frac = 0.3            # fraction of the Kelly bet placed, 0 to 1
# g = 1.0                     # probability weighting, above 0 to 1 (1 = none)
# cash = 100_000              # starting cash in cents (integer >= 1)
# activity = 1.0              # relative chance of getting a turn, > 0
