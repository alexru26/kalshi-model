# Level 1: Level 0 plus a third trader, scheduled news, and
# a triangle network that spreads it. Unlisted settings keep their defaults
# (configs/default.toml).
# Run: uv run python experiments/plot_run.py --config configs/level_1.toml

n_agents = 3
n_steps = 500
turns_per_step = 2            # agents drawn each step (<= n_agents)

n_clues_total = 20
n_private = 10
clue_accuracy = 0.6           # q: chance each clue points to the truth
n_news_seeds = 1              # each news clue starts with one agent, then spreads

# A triangle: a Watts-Strogatz ring of 3 with no rewiring (the one place a network other
# than Holme-Kim is used).
network = "watts_strogatz"
mean_degree = 2
ws_rewire = 0.0

# Traits every agent shares.
market_trust = 10.0           # how many clues the agent thinks the price is worth
w_depth = 0.0                 # ignore book imbalance
w_hearsay = 0.5               # weight given to heard fakes
noise = 0.0                   # belief noise per turn (log-odds)
min_edge = 2.0                # smallest edge worth acting on (cents)
patience = 0.75               # chance of posting a resting order instead of waiting
kelly_frac = 0.5              # fraction of the Kelly bet placed
g = 0.8                       # probability weighting (1 = none)

[traits]                      # traits otherwise drawn per agent, pinned here
n_clues = 5                   # private clues held
cash = 100_000                # starting cash in cents
